# Production stack for the EC2 host: pulls prebuilt images from ghcr.io.
# Reads IMAGE_OWNER, IMAGE_TAG and DOMAIN from the sibling .env file
# (written by Terraform user-data). Run with `docker compose up -d`.
services:
  backend:
    image: ghcr.io/${IMAGE_OWNER}/caas-backend:${IMAGE_TAG:-latest}
    environment:
      - CORS_ORIGINS=https://${DOMAIN}
      - LOG_LEVEL=INFO
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8090/api/v1/health')
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: ghcr.io/${IMAGE_OWNER}/caas-frontend:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
