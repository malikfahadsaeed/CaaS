# Local development stack: builds images from source and serves via Caddy.
# Open http://localhost after `docker compose up --build`.
# (For production on EC2 see infra/docker-compose.prod.yml.)
services:
  backend:
    build: ./backend
    environment:
      - CORS_ORIGINS=http://localhost
      - LOG_LEVEL=INFO
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8090/api/v1/health')
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Plain HTTP locally; override with a real domain for HTTPS.
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
