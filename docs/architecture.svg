<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 690" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d79b00"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9673a6"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="690" fill="#ffffff"/>

  <text x="530" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">CaaS — Serverless (Milestone 2)</text>

  <!-- AWS Cloud boundary -->
  <rect x="210" y="55" width="820" height="500" rx="10" fill="none" stroke="#232f3e" stroke-dasharray="6 4"/>
  <text x="228" y="78" font-size="13" font-weight="bold" fill="#232f3e">AWS Cloud — us-east-2</text>

  <!-- User -->
  <rect x="30" y="250" width="140" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="100" y="280" text-anchor="middle" font-weight="bold">User</text>
  <text x="100" y="298" text-anchor="middle">Web Browser (SPA)</text>

  <!-- CloudFront -->
  <rect x="240" y="235" width="170" height="100" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="325" y="262" text-anchor="middle" font-weight="bold">Amazon CloudFront</text>
  <text x="325" y="280" text-anchor="middle">HTTPS (default cert)</text>
  <text x="325" y="296" text-anchor="middle">/*  &#8594; S3</text>
  <text x="325" y="312" text-anchor="middle">/api/* &#8594; API Gateway</text>

  <!-- S3 -->
  <rect x="470" y="110" width="185" height="85" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="562" y="138" text-anchor="middle" font-weight="bold">Amazon S3 (private)</text>
  <text x="562" y="156" text-anchor="middle">Static Next.js export</text>
  <text x="562" y="172" text-anchor="middle">Origin Access Control</text>

  <!-- ECR -->
  <rect x="720" y="110" width="185" height="85" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="812" y="138" text-anchor="middle" font-weight="bold">Amazon ECR</text>
  <text x="812" y="156" text-anchor="middle">backend container</text>
  <text x="812" y="172" text-anchor="middle">image</text>

  <!-- API Gateway -->
  <rect x="470" y="285" width="185" height="80" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="562" y="313" text-anchor="middle" font-weight="bold">API Gateway</text>
  <text x="562" y="331" text-anchor="middle">HTTP API ($default)</text>
  <text x="562" y="347" text-anchor="middle">ANY /{proxy+}</text>

  <!-- Lambda -->
  <rect x="720" y="270" width="185" height="110" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="812" y="296" text-anchor="middle" font-weight="bold">AWS Lambda</text>
  <text x="812" y="313" text-anchor="middle">container image</text>
  <text x="812" y="329" text-anchor="middle">Web Adapter &#8594; uvicorn</text>
  <text x="812" y="345" text-anchor="middle">FastAPI (chat service)</text>
  <text x="812" y="365" text-anchor="middle" font-style="italic" fill="#555">no VPC &#183; no DB (M2)</text>

  <!-- Bedrock -->
  <rect x="720" y="435" width="185" height="80" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="812" y="463" text-anchor="middle" font-weight="bold">Amazon Bedrock</text>
  <text x="812" y="481" text-anchor="middle">converse (Claude)</text>
  <text x="812" y="497" text-anchor="middle">cross-region profile</text>

  <!-- Terraform -->
  <rect x="30" y="435" width="150" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="105" y="463" text-anchor="middle" font-weight="bold">Terraform (IaC)</text>
  <text x="105" y="481" text-anchor="middle">provisions the</text>
  <text x="105" y="497" text-anchor="middle">AWS resources</text>

  <!-- CI/CD strip -->
  <rect x="210" y="590" width="820" height="70" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="228" y="614" font-weight="bold" fill="#333">CI/CD — GitHub Actions (OIDC, no static keys)</text>
  <text x="228" y="633" fill="#333">build &amp; push image &#8594; ECR &#183; <tspan font-weight="bold">aws lambda update-function-code</tspan></text>
  <text x="228" y="650" fill="#333">next export &#8594; <tspan font-weight="bold">S3 sync</tspan> &#183; <tspan font-weight="bold">CloudFront invalidation</tspan></text>

  <!-- Arrows: request path -->
  <line x1="170" y1="285" x2="238" y2="285" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="204" y="277" text-anchor="middle" fill="#555">HTTPS</text>

  <line x1="410" y1="270" x2="468" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="216" text-anchor="middle" fill="#555">/*</text>

  <line x1="410" y1="300" x2="468" y2="315" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="438" y="324" text-anchor="middle" fill="#555">/api/*</text>

  <line x1="655" y1="322" x2="718" y2="322" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="812" y1="380" x2="812" y2="433" stroke="#9673a6" stroke-width="2" marker-end="url(#arrowP)"/>
  <text x="856" y="412" text-anchor="middle" fill="#9673a6">converse</text>

  <!-- ECR -> Lambda (image) -->
  <line x1="812" y1="195" x2="812" y2="268" stroke="#d79b00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowO)"/>
  <text x="852" y="235" text-anchor="middle" fill="#d79b00">image</text>

  <!-- Terraform provisions -->
  <line x1="180" y1="455" x2="209" y2="400" stroke="#9673a6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowP)"/>
  <text x="150" y="415" text-anchor="middle" fill="#9673a6">provisions</text>

  <!-- CI/CD up into cloud -->
  <line x1="620" y1="590" x2="620" y2="558" stroke="#666" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Monitoring & alerting: CloudWatch -> SNS -> email -->
  <!-- CloudWatch -->
  <rect x="245" y="440" width="170" height="82" rx="8" fill="#f8cecc" stroke="#b85450"/>
  <text x="330" y="466" text-anchor="middle" font-weight="bold">Amazon CloudWatch</text>
  <text x="330" y="484" text-anchor="middle">Alarms + Logs metric filter</text>
  <text x="330" y="500" text-anchor="middle">Lambda errors &#183; API 5xx</text>
  <text x="330" y="516" text-anchor="middle">throttles &#183; Bedrock failures</text>

  <!-- SNS -->
  <rect x="450" y="452" width="120" height="60" rx="8" fill="#f8cecc" stroke="#b85450"/>
  <text x="510" y="478" text-anchor="middle" font-weight="bold">Amazon SNS</text>
  <text x="510" y="496" text-anchor="middle">caas-alerts</text>

  <!-- Email -->
  <rect x="605" y="456" width="95" height="52" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="652" y="480" text-anchor="middle" font-weight="bold">Email</text>
  <text x="652" y="497" text-anchor="middle">ops inbox</text>

  <!-- Lambda/API -> CloudWatch (metrics + logs) -->
  <line x1="718" y1="360" x2="416" y2="452" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
  <text x="560" y="398" text-anchor="middle" fill="#b85450">metrics + logs</text>

  <!-- CloudWatch -> SNS -> Email (alarm notifications) -->
  <line x1="415" y1="482" x2="448" y2="482" stroke="#b85450" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="570" y1="482" x2="603" y2="482" stroke="#b85450" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="510" y="446" text-anchor="middle" fill="#b85450" font-size="11">on alarm</text>
</svg>
